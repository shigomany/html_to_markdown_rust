name: html_to_markdown_rust
description: Rust-powered HTML to Markdown for Dart and Flutter, with configurable formatting, metadata extraction, embedded images, and automatic native builds.
version: 0.2.0
homepage: https://github.com/shigomany/html_to_markdown_rust
repository: https://github.com/shigomany/html_to_markdown_rust
issue_tracker: https://github.com/shigomany/html_to_markdown_rust/issues
documentation: https://github.com/shigomany/html_to_markdown_rust

topics:
  - html
  - markdown
  - ffi
  - rust
  - converter

environment:
  sdk: ^3.13.0

dependencies:
  native_toolchain_rust: ^1.0.7
  ffi: ^2.2.0
  hooks: ^2.2.0
  code_assets: ^2.1.0
  logging: ^1.3.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
  ffigen: ^22.1.0
  html2md: ^1.3.2
  benchmark_harness: ^2.4.0
