[package]
name = "rust"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
html-to-markdown-rs = { version = "3.15.1", features = ["serde", "metadata", "inline-images", "visitor"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23.1"

[build-dependencies]
cbindgen = "0.29.4"
